<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>加权合约行情</title>
<link rel="stylesheet" href="/静态/看板.css">
<style>
  body { padding-bottom: 16px; }
  .wrap { max-width: 1560px; margin: 0 auto; padding: 14px 18px 0; }
  .hdr {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px 18px; display: flex; align-items: center;
    gap: 20px; flex-wrap: wrap;
  }
  .hdr .title { display: flex; align-items: baseline; gap: 10px; }
  .hdr h1 { font-size: 21px; margin: 0; font-weight: 800; letter-spacing: .3px; }
  .hdr .code {
    font-family: var(--mono); font-size: 12px; color: var(--text-3);
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 20px; padding: 3px 10px;
  }
  .hdr .big { font-family: var(--mono); font-size: 30px; font-weight: 800; letter-spacing: -1px; }
  .hdr .chg { font-size: 14px; font-weight: 700; }
  .hdr .grid { display: flex; gap: 22px; flex-wrap: wrap; margin-left: auto; }
  .hdr .grid div { font-size: 12px; color: var(--text-3); }
  .hdr .grid div b { display: block; font-family: var(--mono); font-size: 14px;
                     color: var(--text); font-weight: 700; margin-top: 3px; }

  .bar2 {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: 12px 0 0;
  }
  .tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line);
          border-radius: 11px; padding: 4px; box-shadow: var(--shadow); flex-wrap: wrap; }
  .tab {
    border: none; background: transparent; color: var(--text-2);
    font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 6px 14px; border-radius: 8px; cursor: pointer; transition: all .14s;
  }
  .tab:hover { background: var(--panel-2); color: var(--text); }
  .tab.on { background: var(--brand); color: #fff; box-shadow: 0 3px 10px rgba(37, 99, 235, .3); }

  .inds { display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
          background: var(--panel); border: 1px solid var(--line);
          border-radius: 11px; padding: 6px 10px; box-shadow: var(--shadow); }
  .inds .lab { font-size: 11px; color: var(--text-3); font-weight: 700; margin-right: 2px; }
  .chk {
    display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    font-size: 12px; font-weight: 600; color: var(--text-2);
    border: 1px solid var(--line); border-radius: 20px; padding: 4px 11px;
    transition: all .14s; user-select: none;
  }
  .chk input { display: none; }
  .chk.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .chk:hover { border-color: var(--brand); }

  #chart { width: 100%; height: 660px; margin-top: 12px;
           background: var(--panel); border: 1px solid var(--line);
           border-radius: var(--radius); box-shadow: var(--shadow); }
  .foot { max-width: 1560px; margin: 12px auto 0; padding: 0 18px;
          color: var(--text-3); font-size: 12px; line-height: 1.9;
          display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .foot b { color: var(--text-2); }
  .err { color: var(--up); font-weight: 600; }
</style>
</head>
<body>

<div class="wrap">
  <div class="hdr">
    <div class="title">
      <h1 id="hName">加载中…</h1>
      <span class="code" id="hCode">--</span>
    </div>
    <div>
      <div class="big" id="hPrice">--</div>
      <div class="chg" id="hChg">--</div>
    </div>
    <div class="grid">
      <div>今开<b id="hOpen">--</b></div>
      <div>最高<b id="hHigh">--</b></div>
      <div>最低<b id="hLow">--</b></div>
      <div>昨结<b id="hPre">--</b></div>
      <div>成交量<b id="hVol">--</b></div>
      <div>持仓量<b id="hOi">--</b></div>
      <div>历史最高<b id="hBH">--</b></div>
      <div>历史最低<b id="hBL">--</b></div>
      <div>历史均值<b id="hBM">--</b></div>
      <div>偏离度<b id="hPct">--</b></div>
      <div>行情时间<b id="hTs">--</b></div>
      <div>数据延时<b id="hDelay">--</b></div>
    </div>
  </div>

  <div class="bar2">
    <div class="tabs" id="tabs"></div>
    <div class="inds">
      <span class="lab">主图</span>
      <label class="chk on"><input type="checkbox" data-ind="MA" checked>均线 MA</label>
      <label class="chk"><input type="checkbox" data-ind="BOLL">布林 BOLL</label>
      <span class="lab" style="margin-left:8px">副图</span>
      <label class="chk on"><input type="checkbox" data-ind="VOL" checked>成交量</label>
      <label class="chk on"><input type="checkbox" data-ind="MACD" checked>MACD</label>
      <label class="chk"><input type="checkbox" data-ind="KDJ">KDJ</label>
      <label class="chk"><input type="checkbox" data-ind="RSI">RSI</label>
      <label class="chk"><input type="checkbox" data-ind="WR">威廉 WR</label>
    </div>
    <span class="spacer" style="flex:1"></span>
    <span class="chip" id="cStatus">就绪</span>
  </div>

  <div id="chart"></div>
</div>

<div class="foot">
  <span>品种：<b id="fName">--</b></span>
  <span>加权合约：<b id="fTq">--</b></span>
  <span>周期：<b id="fKind">--</b></span>
  <span>K线根数：<b id="fBars">--</b></span>
  <span>数据源：<b>天勤 TqSdk 加权（仓权）指数合约</b></span>
  <span style="margin-left:auto">设计：<b>公歧子</b>　微信：<b>gongqizi0</b></span>
</div>

<script src="/静态/echarts.min.js"></script>
<script src="/静态/行情.js"></script>
</body>
</html>
